name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate, and deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Resolve production D1 binding
        run: node scripts/hydrate-production-d1.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production D1 hydration
        shell: bash
        run: |
          set -euo pipefail
          placeholder='00000000-0000-0000-0000-000000000000'

          if grep -Fq "$placeholder" wrangler.jsonc; then
            echo "Production D1 binding was not hydrated." >&2
            exit 1
          fi

          echo "Production D1 configuration hydrated successfully."

      - name: Generate browser favicon
        run: bash scripts/generate-favicon.sh

      - name: Type-check and build
        run: npm run build

      - name: Verify generated deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          placeholder='00000000-0000-0000-0000-000000000000'

          if find dist -type f -name 'wrangler.json' -print0 | xargs -0 -r grep -Flq "$placeholder"; then
            echo "Generated deployment configuration still contains the placeholder D1 identifier." >&2
            exit 1
          fi

          echo "Generated deployment configuration is hydrated."

      - name: Apply D1 migrations
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker to Cloudflare
        run: npx --no-install wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
