name: Security audit

on:
  pull_request:
  push:
    branches:
      - v1.02
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch every public branch and tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --force --tags origin
          echo "Fetched $(git for-each-ref --format='%(refname)' refs/remotes/origin refs/tags | wc -l | tr -d ' ') refs for scanning."

      - name: Scan all refs with Gitleaks
        id: gitleaks
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git . \
            --redact=100 \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json

      - name: Create sanitized findings report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s gitleaks-report.json ]]; then
            jq -r '.[] | [(.RuleID // "unknown"), (.File // "unknown"), ((.StartLine // 0) | tostring), ((.Commit // "unknown")[0:40])] | @tsv' \
              gitleaks-report.json > gitleaks-findings.tsv
          else
            : > gitleaks-findings.tsv
          fi

      - name: Upload sanitized findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-sanitized-findings
          path: gitleaks-findings.tsv
          if-no-files-found: error
          retention-days: 7

      - name: Publish sanitized scan result
        if: always()
        shell: bash
        env:
          SCAN_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          set -euo pipefail

          if [[ -s gitleaks-findings.tsv ]]; then
            finding_count="$(wc -l < gitleaks-findings.tsv | tr -d ' ')"
            {
              echo "## Full-history secret scan"
              echo
              echo "Gitleaks detected **${finding_count}** potential secret finding(s). Secret values are not included."
              echo
              while IFS=$'\t' read -r rule file line commit; do
                echo "- \`${rule}\` in \`${file}:${line}\` at commit \`${commit:0:12}\`"
              done < gitleaks-findings.tsv
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Potential secrets were detected in repository history." >&2
            exit 1
          fi

          if [[ "$SCAN_OUTCOME" != "success" ]]; then
            {
              echo "## Full-history secret scan"
              echo
              echo "The scanner did not complete successfully and produced no findings report. Treating this as a failure rather than a clean scan."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Gitleaks failed without producing a report." >&2
            exit 1
          fi

          {
            echo "## Full-history secret scan"
            echo
            echo "No potential secrets were detected across the fetched branch/tag history."
          } >> "$GITHUB_STEP_SUMMARY"
